<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #2c1810, #4a3728);
            color: #e8e6e3;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(139, 115, 85, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-group {
            background: rgba(139, 115, 85, 0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #8b7355;
        }
        
        .control-group h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 1.2em;
        }
        
        .luck-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .luck-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .luck-option input[type="radio"] {
            transform: scale(1.2);
        }
        
        .type-selector {
            display: flex;
            gap: 15px;
        }
        
        .type-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .type-option input[type="radio"] {
            transform: scale(1.2);
        }
        
        .generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            font-weight: bold;
            background: linear-gradient(45deg, #8b7355, #d4af37);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        
        .generate-btn:hover {
            background: linear-gradient(45deg, #d4af37, #f4d03f);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        }
        
        .result {
            background: rgba(139, 115, 85, 0.1);
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-section {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            border-left: 4px solid #d4af37;
        }
        
        .result-title {
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .result-content {
            line-height: 1.6;
        }
        
        .dice-result {
            color: #d4af37;
            font-weight: bold;
        }
        
        .npc-encounter {
            background: rgba(76, 175, 80, 0.2);
            border-left-color: #4caf50;
        }
        
        .special-encounter {
            background: rgba(156, 39, 176, 0.2);
            border-left-color: #9c27b0;
        }
        
        .danger-encounter {
            background: rgba(244, 67, 54, 0.2);
            border-left-color: #f44336;
        }
        
        .battle-encounter {
            background: rgba(255, 152, 0, 0.2);
            border-left-color: #ff9800;
        }
    </style>

                </div>
            </div>
            
            <div class="control-group">
                <h3>Удача партії</h3>

                    </div>
                    <div class="luck-option">
                        <input type="radio" id="luck-1" name="luck" value="-1">
                        <label for="luck-1">-1</label>
                    </div>
                    <div class="luck-option">
                        <input type="radio" id="luck0" name="luck" value="0" checked>
                        <label for="luck0">0</label>
                    </div>
                    <div class="luck-option">
                        <input type="radio" id="luck1" name="luck" value="+1">
                        <label for="luck1">+1</label>
                    </div>
                    <div class="luck-option">
                        <input type="radio" id="luck2" name="luck" value="+2">
                        <label for="luck2">+2</label>
                    </div>
                </div>
            </div>
        </div>
        
        <button class="generate-btn" onclick="generateEvent()">🎲 Згенерувати подію</button>
        
        <div id="result" class="result">
            <div id="mainResult"></div>
            <div id="additionalResults"></div>
        </div>
    </div>

                resultHtml += `<div class="result-section npc-encounter">
                    <div class="result-title">Зустріч з нейтральними НІПами</div>
                    <div><strong>Місце:</strong> ${location}</div>
                    <div><strong>НІПи:</strong> ${npc}</div>
                </div>`;
            } else if (finalResult === 7) {
                // Нове поселення
                const settlement = generateSettlement();
                
                resultHtml += `<div class="result-section npc-encounter">
                    <div class="result-title">Нове невелике поселення</div>
                    <div><strong>Поселення:</strong> ${settlement}</div>
                    <div class="result-content"><strong>Не забудь позначити поселення на карті.</strong></div>
                </div>`;
            } else if (finalResult === 8) {
                // Оаза або склад
                const suppliesRoll = rollDice(6);
                
                resultHtml += `<div class="result-section npc-encounter">
                    <div class="result-title">Оаза або тимчасовий склад</div>
                    <div class="result-content">Персонажі знаходять маленьку оазу у Пустці або полишений кимось тимчасовий склад. 
                    Персонажі поповнюють в цій оазі <strong>${suppliesRoll}</strong> одиниць Припасів або запасу ходу каравану. 
                    Після того, як персонажі покинуть це місце, воно зникне.</div>
                </div>`;
            } else if (finalResult === 9) {
                // Сховок
                const rewardRoll = rollDice(10);
                const hasOwner = rollDice(2) === 1;
                const reward = getReward('small', rewardRoll);
                
                resultHtml += `<div class="result-section npc-encounter">
                    <div class="result-title">Чийсь сховок</div>
                    <div><strong>Знахідка:</strong> ${reward}</div>
                    <div class="result-content">${hasOwner ? 'У сховку є власник, який може колись прийти до персонажів по своє майно.' : 'Сховок здається покинутим.'}</div>
                </div>`;
            } else if (finalResult >= 10) {
                // Особлива зустріч
                const specialRoll = rollDice(10);
                const special = getSpecialEncounter(specialRoll);
                
                resultHtml += `<div class="result-section special-encounter">
                    <div class="result-title">Особлива зустріч</div>
                    <div class="result-title">${special.title}</div>
                    <div class="result-content">${special.content}</div>
                </div>`;
            }
            
            return { main: resultHtml, additional: additionalHtml };
        }

        function generateBadEncounter() {
            const encounterRoll = rollDice(6);
            let resultCategory;
            let resultHtml = `<div class="result-section">
                <div class="result-title">Результат кидка поганої зустрічі</div>
                <div class="result-content">
                    <span class="dice-result">1d6: ${encounterRoll}</span>
                </div>
            </div>`;
            
            let additionalHtml = '';
            
            if (encounterRoll === 1) {
                resultCategory = "0 і нижче";
                resultHtml += `<div class="result-section danger-encounter">
                    <div class="result-title">Смертельна небезпека або смертельна битва</div>
                </div>`;
            } else if (encounterRoll >= 2 && encounterRoll <= 3) {
                resultCategory = "1-2";
                resultHtml += `<div class="result-section danger-encounter">
                    <div class="result-title">Серйозна небезпека або важка битва</div>
                </div>`;
            } else if (encounterRoll >= 4 && encounterRoll <= 5) {
                resultCategory = "3-4";
                resultHtml += `<div class="result-section danger-encounter">
                    <div class="result-title">Середня небезпека або середня битва</div>
                </div>`;
            } else if (encounterRoll === 6) {
                resultCategory = "5";
                resultHtml += `<div class="result-section danger-encounter">
                    <div class="result-title">Легка небезпека або легка битва</div>
                </div>`;
            }
            
            // Генеруємо відповідну подію за таблицею подорожей
            const isDanger = rollDice(2) === 1;
            
            if (isDanger) {
                const dangerRoll = rollDice(36);
                const locationRoll = rollDice(36);
                const danger = getDangerType(dangerRoll);
                const location = getLocation(locationRoll);
                
                let consequences = "";
                if (resultCategory === "0 і нижче") {
                    consequences = "<strong>Короткострокові наслідки:</strong> 3d10 шкоди<br><strong>Довгострокові наслідки:</strong> Смерть<br>Перевірка уникнення небезпеки отримує два Послаблення або взагалі неможлива.";
                } else if (resultCategory === "1-2") {
                    consequences = "<strong>Короткострокові наслідки:</strong> 3d6 шкоди<br><strong>Довгострокові наслідки:</strong> Тяжкий наслідок<br>Перевірка уникнення небезпеки отримує Послаблення.";
                } else if (resultCategory === "3-4") {
                    consequences = "<strong>Короткострокові наслідки:</strong> 2d6 шкоди<br><strong>Довгострокові наслідки:</strong> Середній наслідок";
                } else if (resultCategory === "5") {
                    consequences = "<strong>Короткострокові наслідки:</strong> 1d10 шкоди<br><strong>Довгострокові наслідки:</strong> Легкий наслідок";
                }
                
                additionalHtml += `<div class="result-section danger-encounter">
                    <div><strong>Небезпека:</strong> ${danger}</div>
                    <div><strong>Місце:</strong> ${location}</div>
                    <div class="result-content">${consequences}</div>
                </div>`;
            } else {
                let battleDifficulty, rewardType, rewardCount = 1;
                
                if (resultCategory === "0 і нижче") {
                    battleDifficulty = 'deadly';
                    rewardType = 'large';
                    rewardCount = 2;
                } else if (resultCategory === "1-2") {
                    battleDifficulty = 'hard';
                    rewardType = 'large';
                } else if (resultCategory === "3-4") {
                    battleDifficulty = 'medium';
                    rewardType = 'medium';
                } else if (resultCategory === "5") {
                    battleDifficulty = 'light';
                    rewardType = 'small';
                }
                
                const battleRoll = rollDice(10);
                const locationRoll = rollDice(36);
                
                const battle = getBattleDescription(battleDifficulty, battleRoll);
                const location = getLocation(locationRoll);
                
                let rewardHtml = '';
                if (rewardCount === 2) {
                    const reward1Roll = rollDice(10);
                    const reward2Roll = rollDice(10);
                    rewardHtml = `<div><strong>Нагороди:</strong><br>
                    1. ${getReward(rewardType, reward1Roll)}<br>
                    2. ${getReward(rewardType, reward2Roll)}</div>`;
                } else {
                    const rewardRoll = rollDice(10);
                    const reward = getReward(rewardType, rewardRoll);
                    rewardHtml = `<div><strong>Нагорода:</strong> ${reward}</div>`;
                }
                
                additionalHtml += `<div class="result-section battle-encounter">
                    <div><strong>Битва:</strong> ${battle}</div>
                    <div><strong>Місце:</strong> ${location}</div>
                    ${rewardHtml}
                </div>`;
            }
            
            return { main: resultHtml, additional: additionalHtml };
        }

        function generateEvent() {
            const eventType = getEventType();
            let result;
            
            if (eventType === 'travel') {
                result = generateTravel();
            } else {
                result = generateBadEncounter();
            }
            
            document.getElementById('mainResult').innerHTML = result.main;
            document.getElementById('additionalResults').innerHTML = result.additional;
            
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('show');
            setTimeout(() => {
                resultDiv.classList.add('show');
            }, 100);
        }

        // Ініціалізація
        document.addEventListener('DOMContentLoaded', function() {
            // Додаємо обробники подій для radio buttons
            const eventTypeRadios = document.querySelectorAll('input[name="eventType"]');
            eventTypeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    const luckGroup = document.querySelector('.control-group:nth-child(2)');
                    if (this.value === 'badEncounter') {
                        luckGroup.style.opacity = '0.5';
                        luckGroup.style.pointerEvents = 'none';
                    } else {
                        luckGroup.style.opacity = '1';
                        luckGroup.style.pointerEvents = 'auto';
                    }
                });
            });
        });
    </script>
</body>
</html>
