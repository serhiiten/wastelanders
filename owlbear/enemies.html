<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вороги</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* «Вороги» (етап 4), макет Б «Дві сторінки»: https://claude.ai/artifact/9DEd2HUMgj4ZkmupBY83zK; вузьке вікно 460 px */
  :root{--scr:#13231a; --scr-fg:#8fe0a6; --asp:#e2ad3b; --asp-fg:#2a1d05; --card:#24201b;
    --c-boss:#a3261a; --c-regular:#9a4a20; --c-elite:#8f5f08; --c-statists:#5a5e5b}
  :root.light{--scr:#13231a; --scr-fg:#8fe0a6; --card:#e6dec7}
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  #bar{display:flex;gap:6px;align-items:center;padding:4px 8px 4px 10px;border-bottom:1px solid var(--line);flex:none}
  #bar .ttl{flex:1;min-width:0;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
  #bar .ttl span:last-child{overflow:hidden;text-overflow:ellipsis}
  #bar .ttl .ic{width:16px;height:16px;color:var(--rust)}
  #bar button{background:transparent;width:28px;min-height:26px;padding:0;display:grid;place-items:center}
  #bar button .ic{width:16px;height:16px}
  #bar #b-back{font-size:20px;line-height:1}
  #strip{display:flex;flex-direction:column;gap:6px;flex:none}
  #strip:not(:empty){padding:8px 10px 0}
  #main{flex:1;overflow:auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
  #main>*{flex:none}
  #main h2{margin:6px 0 0}
  input[type=search],input[type=number].fld{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-height:32px;width:100%}
  .rows{display:flex;flex-direction:column;gap:2px}
  .rw{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;min-height:32px}
  .rw:hover{background:var(--btn)}
  .rw .n{flex:1;min-width:0;overflow-wrap:anywhere}
  .rw .h{font-family:"Ubuntu Mono",ui-monospace,Consolas,monospace;color:var(--mut);font-size:13px}
  .rw small{color:var(--mut);font-size:12px}
  .dot{width:9px;height:9px;border-radius:2px;flex:none;background:var(--c-regular)}
  .dot.boss{background:var(--c-boss)} .dot.elite{background:var(--c-elite)} .dot.statists{background:var(--c-statists)}
  details{border-top:1px solid var(--line)}
  summary{cursor:pointer;padding:6px 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700}
  summary:focus-visible{outline:2px solid var(--focus-out)}
  /* картка */
  .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0;border:0}
  .head .nm{font-size:18px;font-weight:700;letter-spacing:.02em;flex:1;min-width:0;overflow-wrap:anywhere}
  .cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;color:#f6eedb;background:var(--c-regular)}
  .cat.boss{background:var(--c-boss)} .cat.elite{background:var(--c-elite)} .cat.statists{background:var(--c-statists)}
  .hp{display:flex;align-items:center;gap:4px}
  .hp .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-right:2px}
  .hp input{width:58px;text-align:center;font-family:"Ubuntu Mono",ui-monospace,Consolas,monospace;font-size:17px;background:var(--scr);color:var(--scr-fg);border:1px solid #000;border-radius:5px;min-height:32px}
  .hp .mx{font-family:"Ubuntu Mono",ui-monospace,Consolas,monospace;color:var(--mut)}
  .pm{width:30px;min-height:30px;padding:0;display:grid;place-items:center;font-weight:700;font-size:16px}
  .hpbar{height:5px;border-radius:3px;background:var(--btn-h);overflow:hidden}
  .hpbar i{display:block;height:100%;background:var(--ok)}
  .hpbar i.warn{background:var(--warn)} .hpbar i.err{background:var(--err)}
  .kv{font-size:13px} .kv b{font-family:"Ubuntu Mono",ui-monospace,Consolas,monospace;font-size:15px}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .asp{display:flex;flex-wrap:wrap;gap:4px}
  .asp span{background:var(--asp);color:var(--asp-fg);font-weight:700;font-style:italic;border-radius:4px;padding:1px 7px;font-size:12.5px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:8px;margin-top:4px}
  .sec::after{content:"";flex:1;border-top:1px solid var(--line)}
  .atk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
  .atk .an{font-weight:700;min-width:0;overflow-wrap:anywhere}
  .atk .note{grid-column:1;font-size:12.5px;color:var(--mut)}
  .atk .roll{grid-column:2;grid-row:1 / span 3;align-self:center}
  .dice{display:inline-flex;align-items:center;gap:5px;font-family:"Ubuntu Mono",ui-monospace,Consolas,monospace;font-size:14px;padding:2px 8px;border-radius:5px;border:1px solid var(--rust);min-height:28px;background:#6e3b22;color:#f4d11a}
  .dice .ic{width:14px;height:14px}
  .dice[data-t=laser]{background:#6b1212;border-color:#ff4b3e;color:#ff9b90}
  .dice[data-t=plasma]{background:#134a22;border-color:#4fd16a;color:#9ff0ae}
  .dice[data-t=gauss]{background:#14306b;border-color:#5a8cff;color:#a9c4ff}
  .dice[data-t=electric]{background:#5a4a0a;border-color:#f0d040;color:#ffe97a}
  .dice[data-t=fire]{background:#6b2e0a;border-color:#ff8a2a;color:#ffc07a}
  .dice[data-t=cryo]{background:#0e4650;border-color:#5ad0e0;color:#aaf0f8}
  .dice[data-t=rad]{background:#3a4a0a;border-color:#b8e03a;color:#dff59a}
  .dice[data-t=poison]{background:#2f3d14;border-color:#8fb03a;color:#cfe39a}
  .dice[data-t=psychic]{background:#3d1a5a;border-color:#b07ae0;color:#ddb8ff}
  .dice[data-t=plain]{background:var(--btn);border-color:var(--line);color:var(--fg)}
  .pips{display:flex;gap:2px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .pip{width:22px;min-height:22px;padding:0;border:0;background:transparent;display:grid;place-items:center}
  .pip i{width:12px;height:12px;border-radius:50%;border:1px solid var(--rust);background:var(--rust)}
  .pip.off i{background:transparent}
  .mv{border:1px solid var(--line);border-left:4px solid var(--c-statists);border-radius:6px;padding:6px 8px;background:var(--card);display:flex;flex-direction:column;gap:4px}
  .mv.lim{border-left-color:var(--rust)}
  .mv.used,.mv.used *{color:var(--mut)} .mv.used .mn{text-decoration:line-through}   /* не прозорість: 2.86:1 (рядок 5.2, ревізор 2026-11-27) */
  .mv .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .mv .mn{font-weight:700;flex:1;min-width:0}
  .limc{font-size:11px;border:1px solid var(--asp);color:var(--asp);border-radius:10px;padding:0 7px}
  :root.light .limc{border-color:#7a4f08;color:#7a4f08}   /* жовтий --asp на світлій картці — 1.52:1 (рядок 5.2, 2026-11-27) */
  .tick{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--mut);background:transparent;border:0;padding:0 2px;min-height:24px}
  .tick i{width:16px;height:16px;border:1px solid var(--mut);border-radius:3px;display:inline-grid;place-items:center;font-style:normal;font-size:12px;color:var(--fg)}
  .mv .tx{font-size:12.5px;white-space:pre-wrap}
  .mv .tx .dice{font-size:12.5px;padding:0 6px;min-height:22px;vertical-align:baseline}
  .foot{display:flex;gap:6px;flex-wrap:wrap}
  .notes{font-size:13px;color:var(--mut);white-space:pre-wrap}
  .center{text-align:center;margin:24px 0}
  /* форма «Свій» / «Редагувати», одним стовпцем (Ф1) */
  select.fld,textarea.fld,input.fld{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-height:32px;width:100%}
  textarea.fld{resize:vertical}
  .hp input.fld{width:70px;text-align:center}
  #main>label{margin:4px 0 -6px}
  label.chk{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg);margin:0}
  .kv:has(select){display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center}
  .frm{display:flex;flex-direction:column;gap:6px}
  .frm .row{display:flex;gap:6px;align-items:center}
  .frm .row>*{flex:1;min-width:0} .frm .row>.pm,.frm .row>input[type=number]{flex:0 0 auto;width:auto}
  .frm .row>input[type=number]{width:70px}
  .asp button.x{background:transparent;border:0;min-height:0;padding:0 2px;color:inherit;font-weight:700}
</style>
</head>
<body>
<div id="bar"><button type="button" id="b-back" hidden>‹</button><span class="ttl"><span id="b-icon"></span><span id="b-title"></span></span><button type="button" id="b-left"></button><button type="button" id="b-right"></button><button type="button" id="b-close"></button></div>
<div id="strip" aria-live="polite"></div>
<div id="main"></div>
<script type="module" src="enemies.mjs"></script>
</body>
</html>
