<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ходи</title>
<style>
  /* Табличка «Ходи» (автор, 2026-11-28, макет А): як табличка Foundry (css/pust-terminal.css, .wastelanders-moves-open) —
     червона, поки вікно закрите, чорна, поки відкрите. Займає все маленьке вікно 96×40. */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  button{box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin:0;padding:0 12px;
    background:linear-gradient(180deg,rgba(255,215,195,.18),rgba(0,0,0,.15)),#a3261a;color:#fbeee4;border:1px solid #d8371f;border-radius:inherit;
    font:800 13px/1 "Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
  button:hover{background:linear-gradient(180deg,rgba(255,215,195,.25),rgba(0,0,0,.1)),#c22e1e;color:#fff}
  button.on{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.2)),#111312;border-color:#3a3a3a}
  button.on:hover{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.15)),#1d201f;color:#fff}
  button:focus-visible{outline:2px solid #e8a13a;outline-offset:-4px}
  svg{width:14px;height:14px;flex:none}
</style>
</head>
<body>
<button type="button" id="b" aria-expanded="false"></button>
<script type="module" src="moves-btn.mjs"></script>
</body>
</html>
