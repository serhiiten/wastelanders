<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал кидків</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* «Журнал кидків», вигляд Б «Картки» (автор, 2026-11-27): підсумок у рамці кольору вердикту, вердикт ще й словом. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .head{flex:none;padding:8px 10px 8px 14px}
  .head h1{flex:1}
  .head button{background:transparent;padding:2px 10px;min-height:28px;font-size:13px}
  .head #close{width:28px;padding:0;display:grid;place-items:center}
  .head #close .ic{width:16px;height:16px;color:var(--fg)}
  #clear{min-width:120px;text-align:center}
  #clear.sure{border-color:var(--err);color:var(--err)}
  #list{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .foot{flex:none;padding:6px 14px 8px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
  .empty{color:var(--mut);margin:24px 8px;text-align:center}
  .roll{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--btn)}
  .roll .num{grid-row:span 2;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font:700 20px/1 "Ubuntu Mono","PT Mono",ui-monospace,monospace;background:var(--field);border:2px solid var(--line);font-variant-numeric:tabular-nums}
  .roll.v0 .num{border-color:var(--err)} .roll.v1 .num{border-color:var(--warn)} .roll.v2 .num{border-color:var(--ok)} .roll.v3 .num{border-color:var(--focus-out);box-shadow:0 0 0 2px var(--focus-out)}
  .roll.fate .num{border-color:var(--rust)}
  .roll.gen .num{border-color:var(--rust);color:var(--rust)} .roll.gen .num .ic{width:22px;height:22px}
  .roll pre.gen{margin:4px 0 0;white-space:pre-wrap;font:inherit;color:var(--fg)}
  .vd.sec{background:var(--field);border-color:var(--rust);color:var(--fg)}
  .roll .top{display:flex;gap:6px;align-items:baseline;min-width:0;flex-wrap:wrap}
  .roll .top b{font-size:15px;overflow-wrap:anywhere;min-width:0}
  .roll .top span{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
  .roll time{color:var(--mut);font-size:12px;align-self:start;font-variant-numeric:tabular-nums}
  .roll .what{grid-column:2 / 4;font-size:13px;overflow-wrap:anywhere}
  .vd{display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:0 8px;margin-left:4px;white-space:nowrap;border:1px solid}
  .vd.v0{background:var(--err-bg);border-color:var(--err)} .vd.v1{background:var(--warn-bg);border-color:var(--warn)}
  .vd.v2{background:var(--ok-bg);border-color:var(--ok)} .vd.v3{background:var(--focus-out);border-color:var(--focus-out);color:#1e1b17}
  .roll .en{grid-column:2 / 4;font-size:12px;color:var(--mut);overflow-wrap:anywhere}
  /* лічильник (сесія Б, автор 2026-11-27): опис поділки — звичайним текстом з переносами; число — на кольоровому тлі */
  .roll .ctr-d{color:var(--fg);font-size:13px;white-space:pre-wrap}
  .roll .num.ctr-n{border-color:transparent;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .roll .re{grid-column:1 / 4;margin-top:4px;padding:3px 8px;border-left:3px solid var(--focus-out);background:var(--field);border-radius:4px;font-size:12px;color:var(--mut);overflow-wrap:anywhere}
  .roll details{grid-column:1 / 4;margin-top:4px;font:12px/1.45 "Ubuntu Mono","PT Mono",ui-monospace,monospace;color:var(--mut);overflow-wrap:anywhere}
  .roll summary{cursor:pointer;font:12px "Roboto Condensed","Arial Narrow",system-ui,sans-serif;min-height:24px;display:flex;align-items:center}
  .roll details b{color:var(--fg)}
  .roll .off{color:var(--mut);text-decoration:line-through}
</style>
</head>
<body>
<div class="head"><span id="h-icon"></span><h1 id="title"></h1><button type="button" id="clear"></button><button type="button" id="close"></button></div>
<div id="list" aria-live="polite"></div>
<div class="foot" id="foot"></div>
<script type="module" src="log.mjs"></script>
</body>
</html>
