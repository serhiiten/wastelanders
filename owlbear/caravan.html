<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аркуш каравану</title>
<link rel="stylesheet" href="ui.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  #bar{display:flex;gap:6px;align-items:center;padding:4px 8px 4px 10px;border-bottom:1px solid var(--line);flex:none}
  #bar .ttl{flex:1;min-width:0;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
  #bar .ttl .ic{width:16px;height:16px;color:var(--rust)}
  #bar .ttl:has(#status:not(:empty)) #b-title{display:none}
  #bar .ttl #status{font-weight:400;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
  #bar button{background:transparent;padding:2px 10px;min-height:26px;font-size:13px}
  #bar #b-close,#bar .ib{width:28px;padding:0;display:grid;place-items:center}
  #bar #b-close .ic,#bar .ib .ic{width:16px;height:16px}
  #strip{display:flex;flex-direction:column;gap:6px;flex:none}
  #strip:not(:empty){padding:8px 10px}
  #panel{flex:1;overflow:auto;padding:18px 18px 20px}
  #frame{flex:1;border:0;width:100%;min-height:0;background:#d9cfb2}
</style>
</head>
<body>
<div id="bar"><span class="ttl"><span id="b-icon"></span><span id="b-title"></span><span id="status"></span></span><button type="button" id="b-left" class="ib"></button><button type="button" id="b-right" class="ib"></button><button type="button" id="b-size"></button><button type="button" id="b-close"></button></div>
<div id="strip" aria-live="polite"></div>
<div id="panel" hidden></div>
<iframe id="frame" title="Аркуш каравану"></iframe>
<script type="module" src="caravan.mjs"></script>
</body>
</html>
