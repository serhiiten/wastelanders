<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <title>Генератор Пустельників</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4e4a0 0%, #e8d075 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c59 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .controls {
            padding: 30px;
            background: #f8f7f3;
            border-bottom: 2px solid #2d5016;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c59 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(45, 80, 22, 0.4);
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 80, 22, 0.6);
        }
        
        .btn-psioniker {
            background: linear-gradient(135deg, #4a7c59 0%, #6ba16e 100%);
        }
        
        .character-sheet {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .section {
            background: #f8f7f3;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2d5016;
        }
        
        .section h2 {
            color: #2d5016;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4a7c59;
        }
        
        .attribute-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .attribute-box {
            text-align: center;
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2d5016;
        }
        
        .attribute-label {
            font-size: 0.9em;
            color: #2d5016;
            margin-bottom: 5px;
        }
        
        .attribute-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4a7c59;
        }
        
        .field {
            margin-bottom: 12px;
            position: relative;
        }
        
        .field-label {
            font-weight: bold;
            color: #2d5016;
            font-size: 0.9em;
            margin-bottom: 3px;
        }
        
        .field-value {
            color: #212529;
            font-size: 1.1em;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border: 1px solid #2d5016;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .reroll-btn {
            background: #4a7c59;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .reroll-btn:hover {
            background: #2d5016;
        }
        
        .skill-item, .perk-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #4a7c59;
        }
        
        .equipment-list {
            list-style: none;
        }
        
        .equipment-list li {
            background: white;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #2d5016;
        }
        
        .export-btn {
            background: #4a7c59;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            background: #2d5016;
            transform: translateY(-1px);
        }
        
        @media print {
            body {
                background: white;
            }
            .controls {
                display: none;
            }
        }
    
        /* --- Text export area (added) --- */
        .export-section {
            padding: 20px 30px 30px;
            background: #f8f7f3;
            border-top: 2px solid #2d5016;
        }
        .export-section h2 {
            color: #2d5016;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4a7c59;
        }
        .text-output {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            padding: 12px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #2d5016;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.95em;
            line-height: 1.35;
        }
        .copy-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
        .copy-hint {
            font-size: 0.9em;
            color: #2d5016;
            opacity: 0.8;
        }
        .copy-btn {
            background: linear-gradient(135deg, #4a7c59 0%, #6ba16e 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(45,80,22,0.25);
        }
        .copy-btn:hover {
            background: #2d5016;
            transform: translateY(-1px);
        }
        @media print {
            .export-section {
                border-top: none;
                padding-top: 0;
            }
            .copy-row { display: none; }
            .text-output { min-height: 0; }
        }

    </style>
</head>

        function rollDice(sides) {
            return Math.floor(Math.random() * sides) + 1;
        }

        function pickRandom(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function getSpecies(archetype) {
            const roll = rollDice(10);
            const distribution = speciesDistribution[archetype];
            
            for (let spec of distribution) {
                if (roll >= spec.range[0] && roll <= spec.range[1]) {
                    return spec.species;
                }
            }
            return "Людина";
        }

        function getName(species, gender = null) {
            if (species === "Людина" || species === "Гуль") {
                if (!gender) gender = Math.random() < 0.5 ? "male" : "female";
                return pickRandom(names[species][gender]);
            } else if (species === "Розумний Пазур Смерті") {
                if (!gender) gender = Math.random() < 0.5 ? "male" : "female";
                return pickRandom(names["Розумний Пазур Смерті"][gender]);
            } else {
                return pickRandom(names[species]?.all || ["Безіменний"]);
            }
        }

        function getRandomPerks(archetype, count) {
            const archetypePerks = perks[archetype];
            const selectedPerks = [];
            
            for (let i = 0; i < Math.min(count, archetypePerks.length); i++) {
                selectedPerks.push(pickRandom(archetypePerks[i]));
            }
            
            return selectedPerks;
        }

        function applySpeciesAttributeModifiers(attributes, species) {
            // Створюємо копію атрибутів для модифікації
            const modifiedAttributes = {...attributes};
            
            if (species === "Гуль") {
                if (modifiedAttributes.СЛ === 2) {
                    modifiedAttributes.СЛ -= 1;
                    modifiedAttributes.ІН += 1;
                }
                if (modifiedAttributes.ПВ === 2) {
                    modifiedAttributes.ПВ -= 1;
                    modifiedAttributes.ВТР += 1;
                }
            }
            
            if (species === "Супермутант") {
                if (modifiedAttributes.ПВ === 2) {
                    modifiedAttributes.ПВ -= 1;
                    modifiedAttributes.ВТР += 1;
                }
                if (modifiedAttributes.ІН === 1) {
                    modifiedAttributes.ІН -= 1;
                    modifiedAttributes.ВТР += 1;
                }
                if (modifiedAttributes.ІН === 2) {
                    modifiedAttributes.ІН -= 2;
                    modifiedAttributes.ВТР += 1;
                    modifiedAttributes.СЛ += 1;
                }
            }
            
            if (species === "Робот") {
                if (modifiedAttributes.ПВ === 2) {
                    modifiedAttributes.ПВ -= 1;
                    modifiedAttributes.ВТР += 1;
                }
            }
            
            if (species === "Розумний Пазур Смерті") {
                if (modifiedAttributes.ПВ === 2) {
                    modifiedAttributes.ПВ -= 1;
                    modifiedAttributes.ВТР += 1;
                }
                if (modifiedAttributes.ІН === 2) {
                    modifiedAttributes.ІН -= 1;
                    modifiedAttributes.ВТР += 1;
                }
            }
            
            return modifiedAttributes;
        }

        function getSpeciesTraitOptions(archetype, species) {
            const speciesTraits = [];
            
            if (archetype === "Здоровило" && species === "Супермутант") {
                speciesTraits.push("Альфа-супермутант");
            }
            
            if ((archetype === "Здоровило" || archetype === "Злодюга" || archetype === "Рейнджер") && species === "Людина") {
                speciesTraits.push("Переконаний дикун");
            }
            
            if ((archetype === "Здоровило" || archetype === "Стрілець") && species === "Робот") {
                speciesTraits.push("Вбудована зброя");
            }
            
            if ((archetype === "Торгаш" || archetype === "Спокусник" || archetype === "Технік") && species === "Робот") {
                speciesTraits.push("Експериментальна модель");
            }
            
            if ((archetype === "Торгаш" || archetype === "Спокусник") && species === "Людина") {
                speciesTraits.push("Дитя цивілізації");
            }
            
            if (archetype === "Злодюга" && species === "Супермутант") {
                speciesTraits.push("Найткін");
            }
            
            if ((archetype === "Технік" || archetype === "(Боже)вільний вчений") && species === "Супермутант") {
                speciesTraits.push("Бета-супермутант");
            }
            
            if (archetype === "(Боже)вільний вчений" && species === "Розумний Пазур Смерті") {
                speciesTraits.push("Альбінос");
            }
            
            if (archetype === "Рейнджер" && species === "Гуль") {
                speciesTraits.push("Сяючий", "Бонсай");
            }
            
            return speciesTraits;
        }

            const archetypeTraits = traits[archetype];

            const selectedTraits = [];
            
            if (isPsionik) {
                // Псионік обов'язково має особливість "Псионік"
                selectedTraits.push("Псионік");
                
                // Додатково може мати 0 або 1 особливість зі свого списку
                if (count >= 1 && archetypeTraits[0] && archetypeTraits[0].length > 0) {
                    selectedTraits.push(pickRandom(archetypeTraits[0]));
                }
            } else {
                // Отримуємо доступні видові особливості
                const speciesTraitOptions = getSpeciesTraitOptions(archetype, species);
                
                for (let i = 0; i < Math.min(count, archetypeTraits.length); i++) {
                    if (archetypeTraits[i] && archetypeTraits[i].length > 0) {
                        // Об'єднуємо звичайні особливості з видовими
                        let allOptions = [...archetypeTraits[i]];
                        if (speciesTraitOptions.length > 0 && i < 2) {
                            allOptions.push(...speciesTraitOptions);
                        }
                        
                        // Видаляємо вже обрані особливості з варіантів
                        allOptions = allOptions.filter(trait => !selectedTraits.includes(trait));
                        
                        if (allOptions.length > 0) {
                            // Випадковий вибір: або обрати особливість, або залишити слот порожнім
                            if (Math.random() < 0.5 || selectedTraits.length === 0) {
                                selectedTraits.push(pickRandom(allOptions));
                            }
                            // Якщо Math.random() >= 0.5 і це не перша особливість, слот залишається порожнім
                        }
                    }
                }
            }
            
            return selectedTraits;
        }

        function applyTraitModifiers(attributes, skills, perks, equipment, traits, archetype) {
            const modifiedAttributes = {...attributes};
            let modifiedSkills = [...skills];
            let modifiedPerks = [...perks];
            let modifiedEquipment = equipment;
            
            traits.forEach(trait => {
                switch(trait) {
                    case "Вибивайло":
                        modifiedAttributes.СЛ += 1;
                        break;
                    case "Обачливий":
                        modifiedAttributes.СПР += 1;
                        modifiedAttributes.ВТР -= 1;
                        break;
                    case "Мініатюрний":
                        modifiedAttributes.ВП += 1;
                        modifiedAttributes.СПР -= 1;
                        break;
                    case "Ботан":
                        modifiedAttributes.ІН += 1;
                        modifiedAttributes.ВТР -= 1;
                        break;
                    case "Сліпуче его":
                        modifiedAttributes.ПВ += 1;
                        modifiedAttributes.СПР -= 1;
                        break;
                    case "Добра душа":
                        // Заміняємо перший скіл з (учень) на (підмайстер)
                        if (modifiedSkills.length > 0) {
                            modifiedSkills[0] = modifiedSkills[0].replace("(Учень)", "(Підмайстер)");
                        }
                        break;
                    case "Альфа-супермутант":
                        modifiedAttributes.СЛ += 1;
                        modifiedAttributes.ВП -= 1;
                        break;
                    case "Переконаний дикун":
                        // Додаємо або покращуємо навичку Виживання
                        const survivalIndex = modifiedSkills.findIndex(skill => skill.includes("Виживання"));
                        if (survivalIndex !== -1) {
                            modifiedSkills[survivalIndex] = "Виживання (Підмайстер)";
                        } else {
                            modifiedSkills.push("Виживання (Учень)");
                        }
                        break;
                    case "Експериментальна модель":
                        // Ця особливість не змінює перки тут, оскільки вони вже згенеровані з правильною кількістю
                        break;
                    case "Найткін":
                        modifiedAttributes.СЛ += 1;
                        modifiedEquipment += ", Залежність (стелс-бой)";
                        break;
                    case "Бета-супермутант":
                        modifiedAttributes.ІН += 1;
                        modifiedAttributes.СЛ -= 1;
                        break;
                    case "Альбінос":
                        modifiedAttributes.ІН += 1;
                        modifiedAttributes.ВТР -= 1;
                        break;
                    case "Сяючий":
                        if (!modifiedPerks.includes("Регенерація")) {
                            modifiedPerks.push("Регенерація");
                        } else {
                            modifiedPerks.push("Міцний");
                        }
                        break;
                }
            });
            
            return {
                attributes: modifiedAttributes,
                skills: modifiedSkills,
                perks: modifiedPerks,
                equipment: modifiedEquipment
            };
        }


        function applySpeciesEquipmentRules(species, equipmentStr) {
            if (!equipmentStr) return equipmentStr;
            // Split by comma+space to preserve existing rendering
            let items = equipmentStr.split(', ').map(s => s.trim()).filter(s => s.length > 0);
            const replLightArmorToCaps = (val) => /легка броня \(1\)/i.test(val) ? "5 кришок" : val;
            const replaceForDeathclaw = (val) => {
                if (/середня броня \(2\)/i.test(val)) return "легка броня (1)";
                if (/середня стрілецька зброя \(1d10\)/i.test(val)) return "5 кришок";
                if (/середня зброя ближнього бою \(1d10\)/i.test(val)) return "5 кришок";
                if (/електрична середня стрілецька зброя \(1d10 \+1d6 роботам та електроніці\)/i.test(val)) return "легка броня (1)";
                if (/електронна відмичка/i.test(val)) return "5 кришок";
                if (/детектор руху/i.test(val)) return "5 кришок";
                return val;
            };
            
            // Robot substitutions
            const replaceForRobot = (val) => {
// Only two allowed replacements per spec:
    // - суперстимпак -> критфікс
    // - бустер (Привабливість) -> хотфікс
    if (/\bсуперстимпак\b/i.test(val)) return val.replace(/\bсуперстимпак\b/gi, "критфікс");
    if (/бустер \(Привабливість\)/i.test(val)) return val.replace(/бустер \(Привабливість\)/gi, "хотфікс");
    return val;
};
            
            // First pass specific substitutions
            items = items.map(val => { let out = val;
                if (species === "Розумний Пазур Смерті") { out = replaceForDeathclaw(out); }
                if (species === "Робот") { out = replaceForRobot(out); }
                // Robots and Deathclaws convert light armor (1) to 5 caps
                if (species === "Робот" || species === "Розумний Пазур Смерті") {
                    out = replLightArmorToCaps(out);
                }
                return out;
            });
// For Robots: completely remove prohibited items from equipment
if (species === "Робот") {
    const robotRemovePatterns = [
        /\bстимпак\b/i,
        /\b2 стимпаки\b/i,
        /\bсуперстимпак\b/i,
        /бустер \(Сила\)/i,
        /бустер \(Привабливість\)/i,
        /бустер \(Вправність\)/i,
        /бустер \(Інтелект\)/i,
        /2 дози бустерів \(Інтелект\)/i,
        /\bДжет\b/i,
        /2 дози Джету/i,
        /міцне бухло/i,
        /\bПсихо\b/i
    ];
    items = items.filter(i => i && !robotRemovePatterns.some(p => p.test(i)));
}

            
            // If Deathclaw, convert any resulting light armor to caps again (covers chain replacements), then add Claws
            if (species === "Розумний Пазур Смерті") {
                items = items.map(replLightArmorToCaps);
                const clawsPattern = /Пазурі \(1d10, ігнорує 1 фізичної броні\)/i;
                if (!items.some(i => clawsPattern.test(i))) {
                    items.push("Пазурі (1d10 ігнорує 1 фізичної броні)");
                }
            }
            return items.join(', ');
        }

        function rerollName(species) {
            const newName = getName(species);
            currentCharacter.name = newName;
            updateCharacterDisplay();
        }

        function rerollConcept(archetype) {
            const newConcept = pickRandom(aspects[archetype].concept);
            currentCharacter.concept = newConcept;
            updateCharacterDisplay();
        }

        function rerollProblem(archetype) {
            const newProblem = pickRandom(aspects[archetype].problem);
            currentCharacter.problem = newProblem;
            updateCharacterDisplay();
        }

        function rerollGoal(archetype) {
            const newGoal = pickRandom(aspects[archetype].goal);
            currentCharacter.goal = newGoal;
            updateCharacterDisplay();
        }

        function generateCharacter(isPsionik = false) {
            let archetype, species;
            
            if (isPsionik) {
                archetype = "Псионік";
                species = "Людина";
            } else {
                archetype = pickRandom(archetypes);
                species = getSpecies(archetype);
            }
            
            const characterName = getName(species);
            
            // Базові атрибути
            let baseAttributes = attributeModifiers[archetype];
            
            // Застосовуємо модифікатори виду до атрибутів
            baseAttributes = applySpeciesAttributeModifiers(baseAttributes, species);
            
            // Навички - люди отримують 3, інші 2
            const characterSkills = skills[archetype];
            let activeSkills = species === "Людина" ? characterSkills : characterSkills.slice(0, 2);
            
            // Особливості (генеруємо спочатку, щоб знати про Експериментальну модель)
            const traitRoll = rollDice(4);
            let traitCount = 0;
            if (traitRoll === 1) traitCount = 0;      // 25% шанс
            else if (traitRoll === 2 || traitRoll === 3) traitCount = 1;  // 50% шанс
            else if (traitRoll === 4) traitCount = 2; // 25% шанс
            const characterTraits = getRandomTraits(archetype, traitCount, species, isPsionik);
            
            // Перки - люди отримують 3, інші 2, але Експериментальна модель дає 3 перки
            let perkCount = species === "Людина" ? 3 : 2;
            if (characterTraits.includes("Експериментальна модель")) {
                perkCount = 3;
            }
            let characterPerks = getRandomPerks(archetype, perkCount);
            
            // Застосовуємо модифікатори особливостей
            const modifiedData = applyTraitModifiers(baseAttributes, activeSkills, characterPerks, "", characterTraits, archetype);
            baseAttributes = modifiedData.attributes;
            activeSkills = modifiedData.skills;
            characterPerks = modifiedData.perks;

// 🔧 Особливість "Обдарований" для окремих архетипів:
// Якщо у персонажа архетип Здоровило/Злодюга/(Боже)вільний вчений та особливість Обдарований,
// він НЕ має другого перка (видаляємо 2-й перк зі списку), але отримує атрибутний бонус:
const hasGifted = characterTraits.some(t => t && t.toLowerCase().includes("обдарований"));
if (hasGifted && (archetype === "Здоровило" || archetype === "Злодюга" || archetype === "(Боже)вільний вчений")) {
    // Прибираємо другий перк, якщо він є
    if (characterPerks.length >= 2) {
        characterPerks.splice(1, 1);
    }
    // Додаємо відповідний бонус
    if (archetype === "Злодюга") {
        baseAttributes.ВТР = (baseAttributes.ВТР || 0) + 1;
    } else {
        baseAttributes.ВП = (baseAttributes.ВП || 0) + 1;
    }
}

            
            // Розрахунки здоров'я та долі
            let maxHealth = 15 + (baseAttributes.ВТР * 3);
            
            // Модифікатори виду для здоров'я
            if (species === "Супермутант" || species === "Розумний Пазур Смерті") {
                maxHealth += 5;
            }
            
            // Перевірка перка "Здоровань"
            if (characterPerks.includes("Здоровань")) {
                maxHealth += 5;
            }
            
            // Перевірка особливості "Бонсай" (тільки для гулів)
            if (species === "Гуль" && characterTraits.includes("Бонсай")) {
                maxHealth -= 3;
            }
            
            // Перевірка особливості "Експериментальна модель" (тільки для роботів)
            if (species === "Робот" && characterTraits.includes("Експериментальна модель")) {
                maxHealth -= 5;
            }
            
            // Жетони долі = 2 + УДЧ
            let fateRestore = 2 + baseAttributes.УДЧ;
            
            // Аспекти
            const concept = pickRandom(aspects[archetype].concept);
            const problem = pickRandom(aspects[archetype].problem);
            const goal = pickRandom(aspects[archetype].goal);
            
            // Спорядження
            const equipmentRoll = rollDice(6) - 1;
            let characterEquipment = equipment[archetype][equipmentRoll];
            
            // Додаємо модифікації спорядження з особливостей
            characterEquipment = modifiedData.equipment || characterEquipment;
// 🔧 Вид та їх вплив на спорядження (робот/розумний Пазур Смерті)
characterEquipment = applySpeciesEquipmentRules(species, characterEquipment);
            
            // Деталь
            const detail = pickRandom(pickRandom(details));
            
            // Зберігаємо поточного персонажа
            currentCharacter = {
                name: characterName,
                archetype: archetype,
                species: species,
                attributes: baseAttributes,
                skills: activeSkills,
                perks: characterPerks,
                traits: characterTraits,
                health: maxHealth,
                fate: fateRestore,
                concept: concept,
                problem: problem,
                goal: goal,
                equipment: characterEquipment,
                detail: detail
            };
            
            updateCharacterDisplay();
        }

        function generatePsionik() {
            generateCharacter(true);
        }

        function updateCharacterDisplay() {
            if (!currentCharacter) return;
            
            const characterHTML = `
                <div class="section" style="grid-column: span 2;">
                    <h2>📋 Основна інформація</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="field">
                            <div class="field-label">Ім'я</div>
                            <div class="field-value">
                                ${currentCharacter.name}
                                <button class="reroll-btn" onclick="rerollName('${currentCharacter.species}')">🎲</button>
                            </div>
                        </div>
                        <div class="field">
                            <div class="field-label">Архетип</div>
                            <div class="field-value">${currentCharacter.archetype}</div>
                        </div>
                        <div class="field">
                            <div class="field-label">Вид</div>
                            <div class="field-value">${currentCharacter.species}</div>
                        </div>
                        <div class="field">
                            <div class="field-label">Деталь</div>
                            <div class="field-value">${currentCharacter.detail}</div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>💪 Атрибути</h2>
                    <div class="attribute-grid">
                        <div class="attribute-box">
                            <div class="attribute-label">СЛ</div>
                            <div class="attribute-value">${currentCharacter.attributes.СЛ >= 0 ? '+' : ''}${currentCharacter.attributes.СЛ}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">СПР</div>
                            <div class="attribute-value">${currentCharacter.attributes.СПР >= 0 ? '+' : ''}${currentCharacter.attributes.СПР}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">ВТР</div>
                            <div class="attribute-value">${currentCharacter.attributes.ВТР >= 0 ? '+' : ''}${currentCharacter.attributes.ВТР}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">ПВ</div>
                            <div class="attribute-value">${currentCharacter.attributes.ПВ >= 0 ? '+' : ''}${currentCharacter.attributes.ПВ}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">ІН</div>
                            <div class="attribute-value">${currentCharacter.attributes.ІН >= 0 ? '+' : ''}${currentCharacter.attributes.ІН}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">ВП</div>
                            <div class="attribute-value">${currentCharacter.attributes.ВП >= 0 ? '+' : ''}${currentCharacter.attributes.ВП}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">УДЧ</div>
                            <div class="attribute-value">${currentCharacter.attributes.УДЧ >= 0 ? '+' : ''}${currentCharacter.attributes.УДЧ}</div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>❤️ Здоров'я та Доля</h2>
                    <div class="attribute-grid">
                        <div class="attribute-box">
                            <div class="attribute-label">Макс. ОЗ</div>
                            <div class="attribute-value">${currentCharacter.health}</div>
                        </div>
                        <div class="attribute-box">
                            <div class="attribute-label">Жетони Долі</div>
                            <div class="attribute-value">${currentCharacter.fate}</div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>🎯 Навички</h2>
                    ${currentCharacter.skills.map((skill, idx) => { const hasLevel = /(\(|（)/.test(skill); const gifted = currentCharacter.traits.includes("Добра душа"); const level = hasLevel ? "" : (gifted && idx===0 ? " (Підмайстер)" : " (Учень)"); return `<div class="skill-item">📚 ${skill}${level}</div>`; }).join('')}
                </div>
                
                <div class="section">
                    <h2>⭐ Перки</h2>
                    ${currentCharacter.perks.map(perk => `<div class="perk-item">✨ ${perk}</div>`).join('')}
                </div>
                
                ${currentCharacter.traits.length > 0 ? `
                <div class="section">
                    <h2>🎭 Особливості</h2>
                    ${currentCharacter.traits.map(trait => `<div class="perk-item">🔸 ${trait}</div>`).join('')}
                </div>
                ` : ''}
                
                <div class="section">
                    <h2>🎒 Спорядження</h2>
                    <ul class="equipment-list">
                        <li>🗡️ Легка зброя (1d6)</li>
                        ${currentCharacter.equipment.split(', ').map(item => `<li>📦 ${item}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="section" style="grid-column: span 2;">
                    <h2>📖 Аспекти персонажа</h2>
                    <div class="field">
                        <div class="field-label">Концепція</div>
                        <div class="field-value">
                            ${currentCharacter.concept}
                            <button class="reroll-btn" onclick="rerollConcept('${currentCharacter.archetype}')">🎲</button>
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label">Проблема</div>
                        <div class="field-value">
                            ${currentCharacter.problem}
                            <button class="reroll-btn" onclick="rerollProblem('${currentCharacter.archetype}')">🎲</button>
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label">Ціль</div>
                        <div class="field-value">
                            ${currentCharacter.goal}
                            <button class="reroll-btn" onclick="rerollGoal('${currentCharacter.archetype}')">🎲</button>
                        </div>
                    </div>
                </div>
            `;
            
            // Display character sheet
            const sheetDiv = document.getElementById('characterSheet');
            sheetDiv.innerHTML = characterHTML;
            sheetDiv.style.display = 'grid';
            
            // Scroll to character sheet
            sheetDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

    <script>
    // --- Text export logic (added) ---
    function fmtSigned(n) { return (n >= 0 ? ('+' + n) : ('' + n)); }

    function characterToPlainText(ch) {
        if (!ch) return "";
        try {
            const a = ch.attributes || {};
            const attrs = [
                "СЛ " + fmtSigned(a.СЛ ?? 0),
                "СПР " + fmtSigned(a.СПР ?? 0),
                "ВТР " + fmtSigned(a.ВТР ?? 0),
                "ПВ " + fmtSigned(a.ПВ ?? 0),
                "ІН " + fmtSigned(a.ІН ?? 0),
                "ВП " + fmtSigned(a.ВП ?? 0),
                "УДЧ " + fmtSigned(a.УДЧ ?? 0)
            ].join(", ");

            // Replicate the displayed skill levels: default (Учень), first becomes (Підмайстер) with "Добра душа"
            const hasGoodSoul = (ch.traits || []).includes("Добра душа");
            const skillsList = (ch.skills || []).map((s, i) => {
                const hasLevel = /(\(|（)/.test(s);
                if (hasLevel) return s;
                if (hasGoodSoul && i === 0) return s + " (Підмайстер)";
                return s + " (Учень)";
            }).join(", ");

            const traitsLine = (ch.traits && ch.traits.length > 0) ? ch.traits.join(", ") : "—";
            const perksLine = (ch.perks && ch.perks.length > 0) ? ch.perks.join(", ") : "—";
            const equip = "Легка зброя (1d6)" + (ch.equipment ? (", " + ch.equipment) : "");

            return [
                "Ім'я: " + (ch.name || "—"),
                "Архетип: " + (ch.archetype || "—"),
                "Вид: " + (ch.species || "—"),
                "Макс. ОЗ: " + (ch.health ?? "—"),
                "Жетони Долі: " + (ch.fate ?? "—"),
                "Атрибути: " + attrs,
                "Навички: " + skillsList,
                "Перки: " + perksLine,
                "Особливості: " + traitsLine,
                "Спорядження: " + equip,
                "Деталь: " + (ch.detail || "—"),
                "Аспекти:",
                "  Концепція — " + (ch.concept || "—"),
                "  Проблема — " + (ch.problem || "—"),
                "  Ціль — " + (ch.goal || "—")
            ].join("\n");
        } catch(e) {
            return "";
        }
    }

    function updateTextOutput() {
        var ta = document.getElementById("textOutput");
        if (!ta) return;
        if (typeof currentCharacter !== "undefined" && currentCharacter) {
            ta.value = characterToPlainText(currentCharacter);
        } else {
            ta.value = "";
        }
    }

    // Copy text button
    function setupCopyButton() {
        var btn = document.getElementById("copyBtn");
        if (!btn) return;
        btn.addEventListener("click", async function() {
            var ta = document.getElementById("textOutput");
            if (!ta) return;
            try {
                await navigator.clipboard.writeText(ta.value || "");
                btn.textContent = "✅ Скопійовано";
                setTimeout(function(){ btn.textContent = "📋 Скопіювати"; }, 1500);
            } catch (err) {
                // Fallback
                ta.focus();
                ta.select();
                document.execCommand("copy");
                btn.textContent = "✅ Скопійовано";
                setTimeout(function(){ btn.textContent = "📋 Скопіювати"; }, 1500);
            }
        });
    }

    // Observe #characterSheet for changes to refresh text output automatically
    document.addEventListener("DOMContentLoaded", function() {
        setupCopyButton();
        var sheet = document.getElementById("characterSheet");
        if (sheet && "MutationObserver" in window) {
            var obs = new MutationObserver(function() {
                updateTextOutput();
            });
            obs.observe(sheet, { childList: true, subtree: true });
        }
        // Initial fill if any character is already present
        updateTextOutput();
    });
    </script>
