# The whole site on GitHub Pages (plan docs/plans/2026-11-28-wiki-pages-plan.md, stage 4, §2.7):
# the rules wiki is built from wiki/ by site/build.py into _site/rules/ (+ _site/404.html), and every other file of the
# repository (the Terminal, the sheets, owlbear/, icons, LICENSE, index.html…) is copied as it is.
# Copied: everything except wiki/, site/, .github/ and git's own files — not a white list, so a new tool file is never lost.
# Needs Settings → Pages → Source = «GitHub Actions». Rollback: Source back to «Deploy from a branch», main, / (root).
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node (the search index, npx pagefind@1.3.0)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the build's libraries (the versions the site was checked with, 2026-11-28)
        run: pip install "Markdown==3.11.3" "PyYAML==6.0.4" "Pillow==13.0.0"
      - name: Build the wiki
        run: python site/build.py --out _site
      - name: Copy the rest of the site
        run: |
          rsync -a --exclude='/wiki/' --exclude='/site/' --exclude='/.github/' --exclude='/.git/' \
                --exclude='/.gitignore' --exclude='/.gitattributes' --exclude='/_site/' ./ _site/
          touch _site/.nojekyll
          test -f _site/rules/index.html && test -f _site/404.html && test -f _site/all_generators.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
